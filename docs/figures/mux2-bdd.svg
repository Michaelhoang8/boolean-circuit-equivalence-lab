<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" role="img" aria-labelledby="title desc"><title id="title">Actual reduced ordered BDD for a two-input multiplexer</title><desc id="desc">Three nonterminal nodes. Selector s0 chooses data d0 on false or d1 on true. Dashed edges are false; solid edges true.</desc><rect width="700" height="430" fill="#f8f7fc"/><g font-family="ui-monospace,monospace" fill="#242131"><path d="M 178 244 L 190 341" stroke="#747484" stroke-width="2.5" fill="none" stroke-dasharray="7 6"/><path d="M 202 244 L 510 341" stroke="#4d3f9f" stroke-width="2.5" fill="none" /><path d="M 498 244 L 190 341" stroke="#747484" stroke-width="2.5" fill="none" stroke-dasharray="7 6"/><path d="M 522 244 L 510 341" stroke="#4d3f9f" stroke-width="2.5" fill="none" /><path d="M 338 94 L 190 196" stroke="#747484" stroke-width="2.5" fill="none" stroke-dasharray="7 6"/><path d="M 362 94 L 510 196" stroke="#4d3f9f" stroke-width="2.5" fill="none" /><circle cx="190" cy="220" r="26" fill="#fff" stroke="#4d3f9f" stroke-width="2"/><text x="190" y="226" text-anchor="middle" font-size="17">d0</text><text x="228" y="226" fill="#676674" font-size="12">#3</text><circle cx="510" cy="220" r="26" fill="#fff" stroke="#4d3f9f" stroke-width="2"/><text x="510" y="226" text-anchor="middle" font-size="17">d1</text><text x="548" y="226" fill="#676674" font-size="12">#4</text><circle cx="350" cy="70" r="26" fill="#fff" stroke="#4d3f9f" stroke-width="2"/><text x="350" y="76" text-anchor="middle" font-size="17">s0</text><text x="388" y="76" fill="#676674" font-size="12">#8</text><rect x="164" y="339" width="52" height="52" rx="6" fill="#e8e6ef"/><rect x="484" y="339" width="52" height="52" rx="6" fill="#4d3f9f"/><text x="190" y="371" text-anchor="middle" font-size="21">0</text><text x="510" y="371" text-anchor="middle" font-size="21" fill="#fff">1</text><text x="30" y="410" font-size="13">Dashed: false / low     Solid: true / high</text></g></svg>
